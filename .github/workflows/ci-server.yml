name: ci-server

on:
  push:
    branches: [main, develop]
  pull_request:
    paths:
      - 'apps/server/**'
      - 'tests/backend/**'
      - 'tests/integration/**'
      - '.github/workflows/ci-server.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/server/requirements.txt
      - run: python -m pip install -r apps/server/requirements.txt pytest
      - run: python -m compileall -q apps/server/app
      - name: Run backend tests when present
        shell: bash
        run: |
          if find tests/backend -name '*.py' -print -quit | grep -q .; then
            PYTHONPATH=apps/server python -m pytest tests/backend -q
          else
            echo 'No executable backend tests found; compile validation passed.'
          fi
