name: ci-ai-pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    paths:
      - 'apps/ai_pipeline/**'
      - '.github/workflows/ci-ai-pipeline.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q apps/ai_pipeline
