name: ci-web

on:
  push:
    branches: [main, develop]
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vercel.json'
      - '.github/workflows/ci-web.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck -w @uda-strokeseg/web
      - run: npm run build
        env:
          VITE_DEMO_MODE: 'true'
          VITE_DEMO_PASSWORD: Pass@123
